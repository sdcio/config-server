apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: data-server-controller
  namespace: sdc-system
  labels:
    app.kubernetes.io/name: sdc-data-server-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdc-data-server-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdc-data-server-controller
        sdcio.dev/data-server: "true"
        sdcio.dev/schema-server: "true"
    spec:
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      serviceAccountName: data-server-controller
      containers:
      - name: controller
        image: input.context[0].data.sdcControllerImage
        imagePullPolicy: Always
        command:
        - /app/controller
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: "NODE_NAME"
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: "NODE_IP"
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: KUBE_FEATURE_WatchListClient
          value: "false"
        - name: METRIC_PORT
          value: "8443"
        - name: PPROF_PORT
          value: "8081"
        - name: HEALTH_PROBE_PORT
          value: "8090"
        - name: REVERTIVE
          value: "true"
        - name: ENABLE_SUBSCRIPTION
          value: "true"
        - name: ENABLE_TARGETDATASTORE
          value: "true"
        - name: ENABLE_TARGETCONFIG
          value: "true"
        - name: ENABLE_SCHEMA
          value: "true"
        - name: ENABLE_ROLLOUT
          value: "true"
        ports:
        - name: data-service
          containerPort: 56000
        startupProbe:
          httpGet:
            path: /readyz
            port: 8090
          failureThreshold: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8090
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: data-server-config
          mountPath: /config
        - name: cache
          mountPath: /cached/caches
        - name: schema-db
          mountPath: /schemadb
        - name: schema-store
          mountPath: /schemas
      volumes:
      - name: data-server-config
        configMap:
          name: data-server
      - name: cache
        emptyDir:
          sizeLimit: 10Gi
      - name: schema-db # persistent schema obj from the parsed yang files
        persistentVolumeClaim:
          claimName: pvc-schema-db
      - name: schema-store # yang file from git
        persistentVolumeClaim:
          claimName: pvc-schema-store
