apiVersion: inv.sdcio.dev/v1alpha1
kind: DiscoveryVendorProfile
metadata:
  name: iosxr.cisco.sdcio.dev
  namespace: default
spec:
  gnmi:
    organization: "Cisco Systems, Inc."
    preserveNamespace: false
    paths:
    - key: version
      path: Cisco-IOS-XR-install-oper:install/version/label
      regex: ^(\d+\.\d+\.\d+(?:\.\d+[\.\w]*)?)$
    - key: platform
      path: Cisco-IOS-XR-install-oper:install/version/chassis-description
    - key: hostname
      path: system/state/hostname
    - key: serialNumber
      path: components/component[name=Rack 0]/state/serial-no
